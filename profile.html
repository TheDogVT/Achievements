<style>
/* Star profile in the stream-overlay skin (ui-lab tab 7): Aurora wood + brass instrument panels, astrolabe,
   eyepiece, meteor bars, glowing Lora numbers. You punch in from the galaxy and land in front of your own star
   (real 3D, middle top); scrolling shrinks it into a pinned badge while the panels scroll underneath. */
:root { --wood:#211014; --wood2:#452127; --wood3:#704034; --brass:#c99645; --brass2:#ffe1a0; --cream:#fff1d1; --tan:#d9b98a; --aur:#62ead7; --aur2:#5eaee9; --star:#cfe9ff; }
* { box-sizing:border-box; }
html { background:#020309; }
body { margin:0; overflow-x:hidden; color:var(--cream); font:500 15px/1.45 Lora, Georgia, serif; background:#020309; }
#gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
#flash { position:fixed; inset:0; z-index:9; background:#fff; opacity:0; pointer-events:none; }
.mono { font:500 11px/1.2 'DM Mono', monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--tan); }
.bar { position:fixed; z-index:5; left:0; right:0; top:0; height:92px; display:flex; align-items:center; gap:14px; padding:0 18px; pointer-events:none; }
.bar > * { pointer-events:auto; }
.bar::before { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg, rgba(20,8,10,.95), rgba(20,8,10,.6) 70%, transparent); opacity:var(--k, 0); }
.mini { margin-left:72px; opacity:var(--k, 0); transform:translateY(calc((1 - var(--k, 0)) * 8px)); pointer-events:none; }
.mini b { display:block; font:700 18px Lora; color:var(--cream); } .mini small { font:500 10px 'DM Mono'; letter-spacing:.12em; color:var(--brass2); text-transform:uppercase; }
.btn { white-space:nowrap; padding:9px 14px; border-radius:4px 12px 4px 12px; border:1px solid var(--wood3); background:linear-gradient(180deg, var(--wood2), var(--wood)); color:var(--cream); font:600 13px Lora; text-decoration:none; cursor:pointer; box-shadow:0 6px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,225,160,.15); }
.btn:hover { border-color:var(--brass); } .bar .right { margin-left:auto; display:flex; gap:10px; } .btn.me.on { border-color:var(--brass); color:var(--brass2); }
.bar .back { position:absolute; left:18px; top:20px; transition:opacity .2s; opacity:calc(1 - var(--k, 0)); }
main { position:relative; z-index:2; max-width:1100px; margin:0 auto; padding:0 20px 60px; overflow-x:clip; } /* name effect canvases can spill wider than a phone */
/* panels: wood, brass tab, engraved inner line, corner rivets */
.panel { position:relative; padding:26px 20px 18px; background:linear-gradient(180deg, rgba(69,33,39,.95), rgba(33,16,20,.95)); border:1px solid var(--wood3); border-radius:4px 18px 4px 18px;
  outline:1px solid rgba(201,150,69,.4); outline-offset:-7px; box-shadow:0 16px 34px rgba(0,0,0,.55); }
.panel::after { content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background:radial-gradient(circle at 12px 12px, #ffe1a0 0 2px, #8a6428 2.5px, transparent 3.5px), radial-gradient(circle at calc(100% - 12px) 12px, #ffe1a0 0 2px, #8a6428 2.5px, transparent 3.5px),
  radial-gradient(circle at 12px calc(100% - 12px), #ffe1a0 0 2px, #8a6428 2.5px, transparent 3.5px), radial-gradient(circle at calc(100% - 12px) calc(100% - 12px), #ffe1a0 0 2px, #8a6428 2.5px, transparent 3.5px); }
.tab { position:absolute; z-index:1; top:-13px; left:18px; padding:4px 12px; background:linear-gradient(180deg, var(--brass2), var(--brass)); color:var(--wood); font:600 12px Lora; letter-spacing:.08em; text-transform:uppercase; border-radius:4px 10px 4px 10px; box-shadow:0 2px 6px rgba(0,0,0,.4); white-space:nowrap; }
.tab::before { content:"✦ "; }
/* hero */
.hero { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:11vh; text-align:center; pointer-events:none; }
.hero > * { pointer-events:auto; }
.plate { position:relative; max-width:calc(100vw - 32px); padding:22px 26px 18px; background:linear-gradient(180deg, var(--wood2), var(--wood)); border:1px solid var(--wood3); border-radius:4px 18px 4px 18px; outline:1px solid rgba(201,150,69,.4); outline-offset:-7px; box-shadow:0 18px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,225,160,.15); }
/* the name stays on the builder's paper (decorations are designed for it), mounted on the plate */
.who { position:relative; display:flex; align-items:center; gap:14px; padding:14px 26px 12px; border-radius:2px; transform:rotate(-1.2deg); color:#3d1e0a;
  background-color:#f0e0c0; background-image:radial-gradient(ellipse 60% 40% at 8% 18%, rgba(140,80,30,.06), transparent 70%), repeating-linear-gradient(transparent 0 30px, rgba(120,75,35,.2) 30px 31px);
  box-shadow:0 10px 24px rgba(0,0,0,.55), inset 0 0 28px rgba(180,130,60,.14); }
.tape { position:absolute; width:88px; height:24px; opacity:.88; background:repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 6px, transparent 6px 12px), var(--tape); box-shadow:0 1px 2px rgba(0,0,0,.2); }
.tape.top-center { top:-12px; left:50%; margin-left:-44px; transform:rotate(-3deg); } .tape.top-left { top:-10px; left:-22px; transform:rotate(-14deg); }
.tape.top-right { top:-10px; right:-22px; transform:rotate(14deg); } .tape.corner-tl { top:8px; left:-30px; transform:rotate(-45deg); }
.pfp { width:50px; height:50px; border-radius:50%; border:2px solid rgba(61,30,10,.35); object-fit:cover; background:#c9a76e; }
.name-line { display:flex; flex-wrap:nowrap; white-space:nowrap; justify-content:center; align-items:baseline; gap:0 .3em; min-width:0; font-size:clamp(24px, 5.4vw, 50px); }
.type { margin:16px 0 0; font:500 13px 'DM Mono'; letter-spacing:.14em; text-transform:uppercase; color:var(--brass2); }
.type .sep { color:var(--wood3); margin:0 .5em; }
.next { width:min(440px, 86vw); margin-top:14px; } .next span { display:block; margin-top:8px; font-size:14px; color:var(--tan); } .next b { color:var(--cream); }
.scroll-hint { margin-top:24px; font:500 10px 'DM Mono'; letter-spacing:.16em; color:var(--tan); text-transform:uppercase; animation:bob 2s ease-in-out infinite; } @keyframes bob { 50% { transform:translateY(5px); } }
/* meteor bar: white-hot head at your progress, tail burning back in --c, dotted sky ahead */
.meteor { position:relative; height:16px; background:radial-gradient(circle, rgba(255,225,160,.35) 0 1px, transparent 1.5px) 0 50% / 9px 16px repeat-x; }
.meteor i { display:block; height:100%; width:var(--p); background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--c) 18%, transparent) 35%, var(--c) 82%, #fff 98%);
  clip-path:polygon(0 47%, calc(100% - 8px) 18%, 100% 50%, calc(100% - 8px) 82%, 0 53%); filter:drop-shadow(0 0 6px var(--c)); animation:burn 1.6s ease-in-out infinite alternate; }
.meteor::after { content:""; position:absolute; left:var(--p); top:50%; width:12px; height:12px; margin:-6px 0 0 -9px; border-radius:50%;
  background:radial-gradient(circle, #fff 0 35%, var(--c) 70%, transparent 72%); box-shadow:0 0 10px #fff, 0 0 22px var(--c), 0 0 40px var(--c); }
.meteor.none i, .meteor.none::after { display:none; }
@keyframes burn { to { filter:drop-shadow(0 0 10px var(--c)) brightness(1.15); } }
/* numbers */
.row { display:grid; grid-template-columns:300px 1fr; gap:22px; margin-top:10px; }
.medal { display:grid; place-items:center; } .medal svg { width:236px; height:236px; }
.medal .num { font:700 52px Lora; fill:var(--cream); } .medal .of { font:500 13px 'DM Mono'; fill:var(--brass2); letter-spacing:.1em; }
.grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:22px 14px; }
.stat b { display:block; font:700 32px/1.05 Lora; color:var(--cream); text-shadow:0 0 18px rgba(98,234,215,.35); } .stat .mono { display:block; margin-top:8px; }
.stat.wide { grid-column:span 2; padding-right:132px; } .stat.wide b { color:var(--aur); font-size:clamp(22px, 2.6vw, 30px); }
.stat.wide::before { content:""; position:absolute; right:22px; top:50%; width:92px; height:92px; margin-top:-46px; border-radius:50%;
  background:radial-gradient(circle, #fff 0 2px, var(--star) 3px, transparent 9px), url(static/resources/sky/stars_patch.jpg) 60% 40% / 280px; box-shadow:inset 0 0 18px #000, 0 0 0 4px var(--brass), 0 0 0 6px #5b3b1c, 0 0 0 7px rgba(255,225,160,.4); }
.gems { display:flex; flex-wrap:wrap; gap:10px; margin:26px 0 8px; }
.gem { display:flex; align-items:center; gap:10px; padding:8px 14px 8px 8px; border-radius:99px; background:rgba(33,16,20,.92); border:1px solid var(--wood3); font:600 14px Lora; color:var(--cream); }
.gem i { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font:700 13px Lora; font-style:normal; color:var(--wood); background:var(--m); box-shadow:0 0 10px var(--m); border:2px solid var(--brass); }
.gem small { display:block; font:500 10px 'DM Mono'; color:var(--tan); letter-spacing:.08em; text-transform:uppercase; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:30px; }
.cat { display:grid; grid-template-columns:100px 1fr 58px; gap:12px; align-items:center; margin:14px 0; font:600 14px Lora; color:var(--cream); }
.cat b { font:500 12px 'DM Mono'; color:var(--tan); text-align:right; } .cat b em { font-style:normal; color:var(--cream); }
.list { list-style:none; margin:0; padding:0; } .list li { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:11px 0; border-top:1px solid rgba(201,150,69,.2); }
.list li:first-child { border-top:0; } .list b { display:block; font:600 15px Lora; } .list small { font:500 11px 'DM Mono'; color:var(--tan); letter-spacing:.06em; text-transform:uppercase; }
.list em { font:500 13px 'DM Mono'; font-style:normal; color:var(--rare, var(--aur)); white-space:nowrap; text-align:right; } .list em small { display:block; font-size:9px; }
.panel.founded { margin-top:30px; } .founded .grid2 { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:10px; }
.moon { display:flex; gap:12px; align-items:center; padding:10px 12px; border-radius:4px 12px 4px 12px; background:rgba(0,0,0,.25); border:1px solid rgba(201,150,69,.22); transition:border-color .2s, box-shadow .2s; }
.moon i { flex:none; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #f3ecdf, #8c877e 60%, #2a2a30); box-shadow:0 0 10px rgba(207,233,255,.25); }
.moon.on { border-color:var(--brass2); box-shadow:0 0 16px rgba(255,225,160,.25); } .moon b { display:block; font:600 14px Lora; } .moon small { font:500 10px 'DM Mono'; color:var(--tan); letter-spacing:.06em; text-transform:uppercase; }
.cta { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:34px; }
.cta a { padding:14px 22px; border-radius:4px 14px 4px 14px; font:700 15px Lora; text-decoration:none; }
.cta .dress { background:linear-gradient(90deg, var(--aur), var(--aur2)); color:#062a2a; box-shadow:0 6px 0 #2a8a8a, 0 0 24px rgba(98,234,215,.35); }
.cta .galaxy { background:linear-gradient(180deg, var(--wood2), var(--wood)); color:var(--cream); border:1px solid var(--wood3); }
.credit { margin-top:30px; text-align:center; font:500 10px 'DM Mono'; color:#6b4d3c; }
.tip { position:fixed; z-index:6; pointer-events:none; padding:7px 11px; border-radius:4px 10px 4px 10px; background:linear-gradient(180deg, var(--wood2), var(--wood)); border:1px solid var(--brass); font:600 13px Lora; color:var(--cream); white-space:nowrap; transform:translate(14px, -50%); opacity:0; transition:opacity .15s; }
.tip small { display:block; font:500 9px 'DM Mono'; letter-spacing:.12em; color:var(--brass2); text-transform:uppercase; }
.missing { min-height:100vh; display:grid; place-items:center; text-align:center; } .missing h2 { font:700 28px Lora; }
body.nogl #gl { background:radial-gradient(circle at 50% 30%, var(--c, #ffd9a0) 0 60px, rgba(255,200,120,.25) 61px, transparent 180px), #020309; }

/* logbook: every charted achievement; theirs lit in category colour, the rest locked with how many have it */
.logbook { margin-top:30px; }
.lb-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:4px 0 10px; }
.lb-chip { padding:6px 11px; border-radius:99px; border:1px solid var(--wood3); background:rgba(0,0,0,.28); color:var(--cream); font:500 11px 'DM Mono'; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
.lb-chip i { font-style:normal; color:var(--tan); margin-left:6px; } .lb-chip[aria-pressed=true] { background:linear-gradient(180deg, var(--brass2), var(--brass)); color:var(--wood); border-color:var(--brass); } .lb-chip[aria-pressed=true] i { color:var(--wood2); }
.lb-chip.lbcat::before { content:""; display:inline-block; width:8px; height:8px; margin-right:7px; border-radius:50%; background:var(--c); box-shadow:0 0 6px var(--c); }
.lb-tools { margin-left:auto; display:flex; gap:8px; }
.lb-tools select, .lb-tools input { padding:7px 10px; border-radius:8px; border:1px solid var(--wood3); background:rgba(0,0,0,.35); color:var(--cream); font:500 12px 'DM Mono'; }
.lb-tools input { width:170px; }
.lb-count { margin:6px 0 12px; font:500 11px 'DM Mono'; letter-spacing:.1em; text-transform:uppercase; color:var(--tan); }
.lb-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(255px, 1fr)); gap:12px; }
.ach { position:relative; display:grid; grid-template-columns:40px 1fr; gap:12px; padding:14px 14px 12px; border-radius:4px 14px 4px 14px; overflow:hidden;
  background:linear-gradient(180deg, rgba(69,33,39,.92), rgba(33,16,20,.95)); border:1px solid rgba(201,150,69,.25); transition:transform .2s, border-color .2s, filter .3s; }
.ach:hover { transform:translateY(-3px); border-color:var(--brass); }
.ach[hidden] { display:none; }
.ach .ico { position:relative; z-index:1; width:40px; height:40px; padding:8px; border-radius:50%; color:var(--c); background:radial-gradient(circle, rgba(0,0,0,.3), rgba(0,0,0,.6)); box-shadow:0 0 0 2px var(--brass), 0 0 0 3px #5b3b1c, 0 0 16px color-mix(in srgb, var(--c) 45%, transparent); }
.ach .ico svg { filter:drop-shadow(0 0 4px var(--c)); }
.ach .body { position:relative; z-index:1; min-width:0; }
.ach b { display:block; font:600 15px/1.25 Lora; color:var(--cream); } .ach p { margin:4px 0 8px; font:400 13px/1.35 Lora; color:var(--tan); }
.bdgs { display:flex; flex-wrap:wrap; gap:5px; }
.bdg { padding:2px 7px; border-radius:99px; border:1px solid rgba(201,150,69,.35); font:500 9px 'DM Mono'; letter-spacing:.1em; text-transform:uppercase; color:var(--tan); white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.bdg.founder { border:0; color:var(--wood); background:linear-gradient(90deg, #ffe1a0, #fff6dc 40%, #c99645 70%, #ffe1a0); background-size:250% 100%; }
.bdg.earned { border-color:rgba(98,234,215,.5); color:var(--aur); } .bdg.rare { border-color:#c9a2ff; color:#d9c2ff; } .bdg.plat { border:0; color:#062a2a; background:linear-gradient(90deg, #62ead7, #cfe9ff, #5eaee9); }
.bdg.deco { border-color:rgba(255,241,209,.4); color:var(--cream); }
.ach .when { display:block; margin-top:8px; font:500 10px 'DM Mono'; letter-spacing:.06em; color:#a88a66; }
.ach.rare:not(.locked) { border-color:rgba(201,162,255,.55); box-shadow:0 0 16px rgba(201,162,255,.15); }
.ach.founded { border-color:var(--brass); }
.ach.locked { filter:saturate(.15) brightness(.72); } .ach.locked .ico { background:none; filter:none; box-shadow:inset 0 0 0 2px rgba(255,225,160,.35); }
.ach.locked .ico::after { content:""; position:absolute; inset:3px; background:rgba(255,225,160,.25); clip-path:inherit; }
/* platinum: a little night sky with a moon (from 1.0), aurora once earned */
.ach.plat { grid-column:span 2; min-height:150px; border-color:rgba(98,234,215,.45); background:#050712; }
.psky { position:absolute; inset:0; pointer-events:none; background:radial-gradient(120% 90% at 80% 10%, rgba(94,174,233,.18), transparent 60%), linear-gradient(180deg, #070a1c, #03040b); }
.psky i { position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; opacity:var(--o); }
.pmoon { position:absolute; right:22px; top:50%; width:64px; height:64px; margin-top:-32px; border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fffdf3, #e8e3d6 35%, #b9b3a6 62%, #6f6a62 100%); box-shadow:0 0 30px rgba(255,248,220,.35), inset -10px -8px 18px rgba(0,0,0,.35); }
.pmoon::after { content:""; position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 60% 58%, rgba(0,0,0,.18) 0 7px, transparent 8px), radial-gradient(circle at 38% 66%, rgba(0,0,0,.14) 0 4px, transparent 5px), radial-gradient(circle at 66% 30%, rgba(0,0,0,.12) 0 5px, transparent 6px); }
.paur span { position:absolute; left:-10%; right:-10%; height:40px; filter:blur(14px); opacity:.45; background:linear-gradient(90deg, transparent, #62ead7, #5eaee9, #9b7bff, transparent); }
.paur span:nth-child(1) { top:6%; } .paur span:nth-child(2) { top:30%; opacity:.3; transform:skewY(-4deg); } .paur span:nth-child(3) { top:55%; opacity:.2; transform:skewY(3deg); }
.ach.plat .body { padding-right:96px; } .ach.plat b { font-size:18px; }
.lb-more { margin:16px 0 0; text-align:center; font:500 11px 'DM Mono'; letter-spacing:.12em; text-transform:uppercase; color:var(--tan); }

/* category icons (never stars: people are the stars) */
.cico { width:100%; height:100%; display:block; }
.cat { --c:var(--aur); } .cat .cl { display:flex; align-items:center; gap:7px; min-width:0; } .cat .cl i { flex:none; width:17px; height:17px; color:var(--c); filter:drop-shadow(0 0 4px var(--c)); }
.list li > span.txt { flex:1; min-width:0; } .li-ico { flex:none; width:30px; height:30px; padding:6px; border-radius:50%; color:var(--c); background:rgba(0,0,0,.3); box-shadow:0 0 0 1.5px var(--brass), 0 0 10px color-mix(in srgb, var(--c) 40%, transparent); }
.lb-chip.lbcat svg { display:inline-block; width:14px; height:14px; margin-right:6px; vertical-align:-3px; color:var(--c); }
/* platinum founder: the ultimate rarity */
@property --ang { syntax:'<angle>'; inherits:false; initial-value:0deg; }
.type .pf { color:#e8f7ff; text-shadow:0 0 12px rgba(159,232,255,.8); }
.moon.plat { border-color:#9fe8ff; background:linear-gradient(90deg, rgba(159,232,255,.14), rgba(0,0,0,.25)); box-shadow:0 0 18px rgba(159,232,255,.2); }
.moon.plat i { width:22px; height:22px; background:radial-gradient(circle at 35% 30%, #fff, #cfeeff 40%, #6aa7c9); box-shadow:0 0 14px #9fe8ff; }
.pfc { display:inline-block; margin-left:6px; padding:1px 7px; border-radius:99px; font:500 9px 'DM Mono'; letter-spacing:.1em; color:#062a2a; background:linear-gradient(90deg, #cfe9ff, #fff, #9fe8ff); vertical-align:middle; }
.ach.pf { grid-column:1 / -1; min-height:200px; padding:24px; border:0; }
.ach.pf::before { content:""; position:absolute; inset:0; z-index:2; padding:2px; border-radius:inherit; pointer-events:none;

<script type="module">
// Published names (usernames, achievement names) go into innerHTML below; escape every one.
function escHtml(t) { return String(t ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
import * as THREE from 'three';

import { get, loadPack, showLoadFailure } from './pack.js';

const $ = id => document.getElementById(id);
let remembered = ''; try { remembered = localStorage.getItem('cosmic.me') || ''; } catch (e) {}
const q = new URLSearchParams(location.search), want = (q.get('u') || remembered).trim().replace(/^@/, '').toLowerCase(), fromGalaxy = q.get('from') === 'galaxy';
if (!want) { location.replace('index.html#find'); await new Promise(() => {}); } // no name and nobody remembered: go find one

// ---------------------------------------------------------------- data
const [map, pack, catalog, founders] = await Promise.all([get('username_map.json'), loadPack(), get('decoration_catalog.json'), get('founders.json')])
  .catch(e => { showLoadFailure(); throw e; });
const sky = pack.rows, sm = pack.starmap, achDefs = pack.achDefs; // derived in the browser from community.json + achievements.json
let uname = Object.keys(map).find(k => k.toLowerCase() === want);
if (!uname) { const safe = want.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); $('main').innerHTML = `<div class="missing"><div><h2>No star called “${safe}” yet</h2><p class="mono">Chat on stream and earn your first achievement to light one up.</p><p><a class="btn" href="index.html#find">Find a star</a></p></div></div>`; await new Promise(() => {}); /* stop here quietly: nothing else on this page applies */ }
const user = await get(`users/${map[uname]}.json`).catch(e => { showLoadFailure(); throw e; });
const ranked = sky.slice().sort((a, b) => b[1] - a[1]), rank = ranked.findIndex(r => r[0].toLowerCase() === want), N = ranked.length; // the two files can differ in capitalisation
if (rank >= 0) uname = ranked[rank][0]; // show the name as the pack sees it, not the lowercase map key
const earnedN = ranked[rank][1], tier = user.legacy || 0, isQuasar = rank === 0 && ranked[0][1] > 0, isRunaway = tier === 2 && !isQuasar;
const b = bandOf(earnedN), B = BANDS[b];
const defs = {}, catTotal = {};
for (const c of sm.categories) { catTotal[c.cat] = c.stars.length; for (const [id, name, earners] of c.stars) defs[id] = { name: name.replace(/^\(Platinum\)\s*/, ''), plat: name.startsWith('(Platinum)'), cat: c.cat, earners }; } // Platinum is a flag, not part of the name
Object.assign(catTotal, pack.meta?.category_totals || {}); // real category sizes (hand-awarded left out); older meta: discovered only
const earned = Object.entries(user.achievements.earned || {}).filter(([id]) => defs[id]).map(([id, at]) => ({ id, at: new Date(at), ...defs[id] }));
const founded = Object.entries(user.achievements.founded || {}).filter(([id]) => defs[id]).map(([id, at]) => ({ id, at: new Date(at), ...defs[id] })).sort((a, c) => (c.plat - a.plat) || (a.at - c.at)); // platinum founded first
const got = earned.concat(founded); // the publisher files founded achievements separately; both are owned
const catHave = {}; got.forEach(e => { catHave[e.cat] = (catHave[e.cat] || 0) + 1; });
const topCat = Object.entries(catHave).sort((a, c) => c[1] - a[1])[0]?.[0] || 'chat';
const pct = n => (n * 100 >= 10 ? Math.round(n * 100) : (n * 100).toFixed(1)) + '%';
const rel = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
const ago = d => { const s = (d - Date.now()) / 1000, A = Math.abs(s); for (const [u, n] of [['year', 31536e3], ['month', 2592e3], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60]]) if (A >= n) return rel.format(Math.round(s / n), u); return 'just now'; };
const monthName = ym => new Date(ym + '-15').toLocaleDateString('en', { month: 'short', year: 'numeric' });
const starHex = '#' + kelvin(B.K).getHexString();
document.documentElement.style.setProperty('--starc', starHex); // the fx layer tints things with their star

// ---------------------------------------------------------------- page text
document.title = `${uname} · Star Profile`;
const paint = (el, id, text) => {
  const tr = window.DECORATION_NAME_TRANSLATOR; if (!tr) { el.textContent = text || ''; return; }
  const config = id && catalog[id] ? { ...(catalog[id].config || {}) } : {}; if (text !== undefined) config.text = text;
  tr.applyTagPresentation(el, config, 'name-tag');
};
const act = (user.decorations && user.decorations.active) || {};
act.name_prefix ? paint($('n-prefix'), act.name_prefix) : $('n-prefix').remove();
paint($('n-base'), act.name_base, uname);
act.name_suffix ? paint($('n-suffix'), act.name_suffix) : $('n-suffix').remove();
// a long username + prefix + suffix shrinks to the tag instead of wrapping (same rule as the builder and the
// stream's chat; this line is centred, so it scales from its centre)
const fitName = () => {
  const line = document.querySelector('.who .name-line'); if (!line) return;
  line.style.transform = ''; const room = line.clientWidth;
  // it sits beside the picture as a flex item, so stop flex from squeezing it while measuring
  line.style.flex = '0 0 auto'; line.style.width = 'max-content'; const natural = line.offsetWidth; line.style.width = ''; line.style.flex = '';
  const scale = room > 0 && natural > 0 ? Math.min(1, room / natural) : 1;

  if (TAPE[act.washi_color]) { const t = document.createElement('i'); t.className = 'tape ' + String(act.washi_position || 'washi_top_center').replace('washi_', '').replace('_', '-'); t.style.setProperty('--tape', TAPE[act.washi_color]); document.querySelector('.who').appendChild(t); } }
$('kind-tab').textContent = kind;
const legacyTag = tier === 1 ? 'Legacy binary' : tier === 2 ? 'Legendary' : '';
const toQuasar = ranked[0][1] - earnedN;
const platF = founded.filter(f => f.plat).length;
$('type').innerHTML = [platF && `<span class="pf">✦ Platinum founder${platF > 1 ? ' ×' + platF : ''}</span>`, legacyTag, `#${rank + 1} of ${N}`, isQuasar ? 'the quasar' : ranked[0][1] > 0 ? `${toQuasar} from the quasar` : ''].filter(Boolean).join('<span class="sep">·</span>');
$('mini-name').textContent = uname; $('mini-type').textContent = `${kind} · #${rank + 1}`;
{ // progress to the next temperature as a meteor (star colour burning toward the next band), or the quasar race
  const el = $('next'), next = BANDS[b + 1];
  if (isQuasar) el.innerHTML = `<span><b>The core of the galaxy.</b> Most achievements in the pack${ranked[1] ? ` · ${earnedN - ranked[1][1]} ahead of ${escHtml(ranked[1][0])}` : ''}</span>`;
  else if (!next) el.innerHTML = `<span><b>Hottest band reached.</b> ${toQuasar} achievement${toQuasar === 1 ? '' : 's'} from the quasar</span>`;
  else el.innerHTML = `<div class="meteor" style="--p:${Math.max(4, (earnedN - B.min) / (next.min - B.min) * 100)}%;--c:#${kelvin(next.K).getHexString()}"><i></i></div><span><b>${next.min - earnedN} more</b> to burn ${next.name}</span>`;
}
{ // "stars collected" gauge: one thick ring that fills to earned / discovered with their star riding the tip;
  // a clean brass bezel with ten notches (each 10%) so "about half full" reads at a glance
  const frac = sm.discovered ? earnedN / sm.discovered : 0, C = 2 * Math.PI * 76; // debut day: nothing discovered yet
  let notches = ''; for (let i = 0; i < 10; i++) { const a = i / 10 * 6.283; notches += `<circle cx="${110 + Math.sin(a) * 94}" cy="${110 - Math.cos(a) * 94}" r="${i ? 1.7 : 2.6}" fill="#c99645"/>`; }

    <circle class="prog" cx="110" cy="110" r="76" fill="none" stroke="url(#aurP)" stroke-width="15" stroke-linecap="round" stroke-dasharray="${C * frac} ${C}" transform="rotate(-90 110 110)"/>
    <g class="tip" transform="rotate(${frac * 360} 110 110)"><circle cx="110" cy="34" r="10" fill="${starHex}" filter="url(#glP)"/><circle cx="110" cy="34" r="4.2" fill="#fff"/></g>
    <text x="110" y="118" text-anchor="middle" class="num">${earnedN}</text><text x="110" y="146" text-anchor="middle" class="of">OF ${sm.discovered} · ${pct(frac)}</text>`;
}
const rarest = got.slice().sort((a, c) => a.earners - c.earners)[0];
$('stats').innerHTML = [
  ['Founded', founded.length, 'first in the pack'],
  ['Rank', `#${rank + 1}`, `of ${N} stars`],
  ['Chat', (user.stats?.messages || 0).toLocaleString(), 'messages'],
  ['With us', user.stats?.active_months || 0, `months${user.stats?.first_seen ? ' · since ' + monthName(user.stats.first_seen) : ''}`],
  ['Rarest', rarest ? rarest.name : '—', rarest ? `${pct(rarest.earners / N)} of the pack` : 'nothing yet', 'wide'],
  ['Style', (user.decorations?.unlocked || []).length, 'decorations'],
  ['Top month', `${(user.top_months || []).filter(m => m.rank === 1).length}×`, '#1 finishes'],
].map(([tab, v, k, cls = '']) => `<div class="panel stat ${cls}"><span class="tab">${tab}</span><b>${v}</b><span class="mono">${k}</span></div>`).join('');
const KIND = { cheers: 'Bits', donations: 'Donations', chat: 'Chat', gifted: 'Gifted', gifts: 'Gifted', subs: 'Gifted' };
$('medals').innerHTML = (user.top_months || []).slice().sort((a, c) => a.rank - c.rank || c.month.localeCompare(a.month)).map(m =>
  `<span class="gem" style="--m:${['#ffe1a0', '#d9e0f2', '#d08a4a'][m.rank - 1] || '#7a5a48'}"><i>${m.rank}</i><span>${KIND[m.kind] || m.kind}<small>${monthName(m.month)}</small></span></span>`).join('');
$('cats').innerHTML = Object.keys(CATS).filter(c => catTotal[c]).map(c => {
  const have = catHave[c] || 0, [label, col] = CATS[c];
  return `<div class="cat" style="--c:${col}"><span class="cl"><i>${catIcon(c)}</i>${label}</span><div class="meteor${have ? '' : ' none'}" style="--c:${col};--p:${Math.max(have ? 3 : 0, have / catTotal[c] * 100)}%"><i></i></div><b><em>${have}</em>/${catTotal[c]}</b></div>`;
}).join('');
if (!$('cats').innerHTML) $('cats').innerHTML = '<p style="margin:0;color:var(--tan)">Categories appear as the pack discovers achievements.</p>';
const rareCol = r => r < .02 ? '#ffe1a0' : r < .06 ? '#c9a2ff' : r < .15 ? '#5eaee9' : 'var(--aur)';
$('latest').innerHTML = got.slice().sort((a, c) => c.at - a.at).slice(0, 6).map(e =>
  `<li style="--rare:${rareCol(e.earners / N)};--c:${CATS[e.cat]?.[1] || '#888'}"><span class="li-ico">${catIcon(e.cat)}</span><span class="txt"><b>${escHtml(e.name)}</b><small>${CATS[e.cat]?.[0] || e.cat} · ${ago(e.at)}</small></span><em>${pct(e.earners / N)}<small>have it</small></em></li>`).join('');
if (!got.length) $('latest').innerHTML = '<li><span class="txt" style="color:var(--tan)">Nothing yet. Earn an achievement on stream and it lands here.</span></li>';

else $('founded-card').innerHTML = '<span class="tab">Founded</span><p style="margin:0;color:var(--tan)">No moons yet. Be the first to unlock something and it starts orbiting your star.</p>';
{ // logbook: only the achievements they have (nothing locked is shown); platinum gets a sky, platinum founder is the ultimate
  const esc = t => String(t).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const desc = {}; for (const c of Object.values(achDefs)) for (const [id, v] of Object.entries(c)) desc[id] = v.desc;
  const deco = {}; for (const e of Object.values(catalog)) if (e.achievement_id) (deco[e.achievement_id] ||= []).push(e);
  const mine = Object.fromEntries(earned.map(e => [e.id, e])), mineF = new Set(founded.map(f => f.id));
  founded.forEach(fd => { if (!mine[fd.id]) mine[fd.id] = fd; }); // founding something means having it, even if the earned list missed it
  const day = d => d.toLocaleDateString('en', { day: 'numeric', month: 'short', year: 'numeric' });
  const all = Object.keys(mine).filter(id => defs[id]).map(id => ({ id, ...defs[id], desc: desc[id] || '', got: mine[id], fd: mineF.has(id), first: founders[id]?.founder_name }));
  all.forEach(a => { a.pf = a.plat && a.fd; });
  const have = {}; all.forEach(a => { have[a.cat] = (have[a.cat] || 0) + 1; });
  const sky = pf => { let st = ''; for (let i = 0; i < (pf ? 60 : 34); i++) st += `<i style="left:${(i * 37 % 96) + 2}%;top:${(i * 53 % 88) + 5}%;--t:${(i % 7) * .55}s;--o:${(.3 + (i * 13 % 7) / 10).toFixed(2)}"></i>`; return `<div class="psky">${st}<div class="paur"><span></span><span></span><span></span></div><div class="pmoon${pf ? ' pl' : ''}"></div></div>`; };
  const el = a => {
    const share = a.earners / N, rare = a.earners > 0 && share <= .05, col = CATS[a.cat]?.[1] || '#9aa3b8', rewards = deco[a.id] || [];

        gl_FragColor = vec4(mix(vec3(.09, .03, .03), vec3(.9, .28, .12), rim * .6), a); }` }));
  cocoon.renderOrder = 2; sys.add(cocoon);
  tips.push({ mesh: cocoon, title: 'Dust cocoon', sub: 'A protostar · earn a first achievement to ignite' });
}
tips.push({ mesh: star, title: kind, sub: `${earnedN} achievements · ${B.name.toLowerCase()} hot` });

// ---------------------------------------------------------------- platinum tiles: a little live 3D world each
// One small renderer per Platinum tile (there are only a handful), drawing only while the tile is on screen.
// The moon is procedural (seas, crater rims, grain) and lit from one side; a Platinum founder's moon also gets an
// iridescent rim, a tilted aurora ring with orbiting sparkles, a halo, and aurora curtains in the sky behind it.
{
  const FOV = 35, DIST = 9, live = [];
  const animOn = () => document.documentElement.classList.contains('fx-platsky');
  const vUv = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`;
  function mount(tile) {
    let r; try { r = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' }); } catch (e) { return; }
    const pf = tile.classList.contains('pf') ? 1 : 0, seed = [...tile.dataset.seed].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 997, 7) / 997;
    r.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); r.toneMapping = THREE.ACESFilmicToneMapping;
    r.domElement.className = 'pcan'; tile.prepend(r.domElement); r.domElement.insertAdjacentHTML('afterend', '<div class="pshade"></div>'); tile.classList.add('gl');
    const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(FOV, 2, .1, 100); cam.position.set(0, 0, DIST);
    const T = { value: seed * 100 }, P = { value: pf };
    const bg = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({ uniforms: { uTime: T, uPF: P }, vertexShader: vUv, depthWrite: false,
      fragmentShader: FBM + `uniform float uTime, uPF; varying vec2 vUv;
        void main(){ vec2 uv = vUv; float n = fbm(vec3(uv * vec2(3., 1.6) + vec2(uTime * .015, 0.), uTime * .025));
          vec3 neb = mix(vec3(.04, .22, .32), vec3(.3, .12, .42), smoothstep(-.2, .5, fbm(vec3(uv * 2.4, uTime * .02 + 5.))));
          vec3 c = vec3(.012, .016, .04) + neb * smoothstep(-.1, .6, n) * smoothstep(.05, .75, uv.x) * .6;
          float cur = sin(uv.x * 9. + uTime * .35 + n * 3.) * .5 + .5, band = exp(-pow((uv.y - .72 - .08 * sin(uv.x * 4. + uTime * .2)) * 4.5, 2.));
          c += uPF * mix(vec3(.2, .9, .75), vec3(.6, .45, 1.), uv.x) * band * cur * .4;
          gl_FragColor = vec4(c, 1.); }` }));
    bg.position.z = -(DIST + 8); cam.add(bg); sc.add(cam); // the sky rides with the camera, so it always fills the tile
    const layer = (n, depth, size, speed) => { // stars that drift past, wrapping round; two depths = parallax
      const pos = new Float32Array(n * 3), tw = new Float32Array(n); let s0 = seed * 9973 + depth;
      const rnd2 = () => (s0 = (s0 * 16807 + 11) % 2147483647) / 2147483647;
      for (let i = 0; i < n; i++) { pos.set([(rnd2() - .5) * 40, (rnd2() - .5) * 14, -depth], i * 3); tw[i] = rnd2() * 6.28; }
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('tw', new THREE.BufferAttribute(tw, 1));
      const pts = new THREE.Points(g, new THREE.ShaderMaterial({ ...addOne, uniforms: { uTime: T, uPR: { value: r.getPixelRatio() } },
        vertexShader: `attribute float tw; uniform float uTime, uPR; varying float vA; void main(){ vec3 p = position; p.x = mod(p.x - uTime * ${speed.toFixed(3)} + 20., 40.) - 20.;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.); gl_PointSize = ${size.toFixed(1)} * uPR; vA = .55 + .45 * sin(uTime * 1.7 + tw); }`,
        fragmentShader: `varying float vA; void main(){ vec2 d = gl_PointCoord - .5; float a = exp(-dot(d, d) * 18.) * vA; gl_FragColor = vec4(vec3(.85, .9, 1.) * a, 1.); }` }));
      pts.frustumCulled = false; sc.add(pts);
    };
    layer(260, 6, 2.2, .06); layer(120, 2, 3.4, .18);
    const sys = new THREE.Group(); sc.add(sys);
    const moon = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), platMoonMat(T, pf, seed, new THREE.Vector3(-.7, .45, .55).normalize()));
    sys.add(moon);
    if (pf) { const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(), color: 0x9fe8ff, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: .75 })); halo.scale.setScalar(4.6); halo.position.z = -.5; sys.add(halo); }
    const { ring, spark } = platRing(T, pf, r.getPixelRatio()); sys.add(ring);
    const st = { r, sc, cam, bg, sys, moon, ring, spark, T, tile, vis: false, boost: 0, hover: 0, w: 0, h: 0 };
    tile.addEventListener('pointerenter', () => { st.hover = 1; }); tile.addEventListener('pointerleave', () => { st.hover = 0; });
    live.push(st);
  }
  function fit(st) {
    const w = st.tile.clientWidth, h = st.tile.clientHeight; if (!w || !h || (w === st.w && h === st.h)) return;
    st.w = w; st.h = h; st.r.setSize(w, h, false); st.cam.aspect = w / h; st.cam.updateProjectionMatrix();
    const halfH = (DIST + 8) * Math.tan(FOV * Math.PI / 360); st.bg.scale.set(halfH * 2 * st.cam.aspect * 1.02, halfH * 2 * 1.02, 1);
    const hh = DIST * Math.tan(FOV * Math.PI / 360), hw = hh * st.cam.aspect, sz = Math.min(hh * .62, hw * .26); // moon ~ 60% of the tile height, but never wider than its side of a narrow tile
    st.sys.scale.setScalar(sz); st.sys.position.x = Math.max(hw * .55, hw - 2.7 * sz);
  }
  document.querySelectorAll('.ach.plat').forEach(mount);
  const io = new IntersectionObserver(es => es.forEach(e => { const st = live.find(x => x.tile === e.target); if (st) st.vis = e.isIntersecting; }));
  live.forEach(st => io.observe(st.tile));
  let last = performance.now();
  const tick = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now; const anim = animOn() && !still;
    for (const st of live) {
      if (!st.vis || st.tile.hidden) continue;
      fit(st);
      st.boost += (st.hover - st.boost) * .06; const sp = (1 + st.boost * 2.5) * (anim ? 1 : 0);
      st.T.value += dt * sp; st.moon.rotation.y += dt * .12 * sp; st.moon.rotation.x = .25;
      if (st.ring) st.ring.rotation.z += dt * .05 * sp; if (st.spark) st.spark.rotation.z += dt * .25 * sp;
      st.cam.position.set(Math.sin(st.T.value * .1) * .25, Math.cos(st.T.value * .13) * .15, DIST - st.boost * 1.2); st.cam.lookAt(st.sys.position.x * .25, 0, 0);
      st.r.render(st.sc, st.cam);
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  document.addEventListener('logbook:drawn', () => live.forEach(st => { st.w = 0; })); // filters can resize tiles
}

// ---------------------------------------------------------------- layout, scroll pin, arrival, exit
let W = 0, H = 0, ppu = 1, s0 = 1, k = 0, arrive0 = performance.now(), leave = null;
function resize() {
  W = innerWidth; H = innerHeight; renderer.setSize(W, H, false); composer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix();
  ppu = H / (2 * 9 * Math.tan(35 * Math.PI / 360));            // screen px per world unit at the star's depth
  s0 = Math.min(H * .13, W * .2) / ppu;                         // a yellow star (R 1) ~ 13% of the screen height
  const bh = 2 * 69 * Math.tan(35 * Math.PI / 360) * 1.1; back.scale.set(Math.max(bh * W / H, bh * 1.4), Math.max(bh * W / H, bh * 1.4) / 1.4, 1);
}
resize(); addEventListener('resize', resize);
const ease = x => 1 - (1 - x) ** 3, lerp = (a, c, x) => a + (c - a) * x;
const flash = $('flash');
function frame(now) {
  const t = still ? 6 : now / 1000; U.uTime.value = t;
  k = ease(Math.min(1, Math.max(0, scrollY / (H * .5))));
  document.documentElement.style.setProperty('--k', k.toFixed(3));
  // arrival: from the galaxy we come out of the flash with the star filling the screen; a shared link just grows it in
  const ar = still ? 1 : Math.min(1, (now - arrive0) / (fromGalaxy ? 1400 : 800)), ae = ease(ar);
  let zoom = fromGalaxy ? 1 : lerp(.2, 1, ae), fl = fromGalaxy ? 1 - Math.min(1, ar * 2.6) : 0; // from the galaxy the flight already brought us here
  if (leave) { const lk = Math.min(1, (now - leave.t0) / 420); zoom *= lerp(1, 1.12, lk); fl = Math.max(fl, Math.min(1, lk * 1.3)); if (lk >= 1 && !leave.gone) { leave.gone = true; location.href = leave.href; } }
  flash.style.opacity = fl;
  const pinR = 15, sc = lerp(s0, pinR / (R * ppu), k) * zoom;   // pinned: ~15 px radius badge in the top bar
  const sx = lerp(W / 2, W < 860 ? 36 : 46, k), sy = lerp(H * (W < 860 ? .3 : .32), W < 860 ? 38 : 46, k);
  sys.position.set((sx - W / 2) / ppu, (H / 2 - sy) / ppu, 0); sys.scale.setScalar(sc);
  star.rotation.y = t * .06; if (cocoon) cocoon.rotation.y = -t * .02;
  for (const f of facing) f.quaternion.copy(camera.quaternion);
  moons.forEach(m => { const a = m.ph + t * m.w; m.m.position.set(Math.cos(a) * m.r, Math.sin(a) * m.r, 0); if (m.m.userData.ring) { m.m.userData.ring.rotation.z = t * .05; if (m.m.userData.spark) m.m.userData.spark.rotation.z = t * .25; } m.s += (1 + m.hi * 1.4 - m.s) * .15; m.m.scale.setScalar(m.s); });
  if (companion) { const a = companion.ph + t * .35; companion.g.position.set(Math.cos(a) * companion.r, Math.sin(a) * companion.r, 0); }
  if (isRunaway) backTex.offset.set(t * .004, t * .0007);
  composer.render();
  if (!still || leave) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (still) addEventListener('scroll', () => requestAnimationFrame(frame), { passive: true });

// leaving: dive back out to the galaxy, landing on this star
const toGalaxy = e => { e.preventDefault(); const href = `index.html?focus=${encodeURIComponent(uname)}`; if (still) { location.href = href; return; } if (!leave) { leave = { t0: performance.now(), href }; if (still) requestAnimationFrame(frame); } };
addEventListener('pageshow', e => { if (e.persisted) { leave = null; flash.style.opacity = 0; requestAnimationFrame(frame); } }); // back button
$('back').addEventListener('click', toGalaxy); $('back2').addEventListener('click', toGalaxy);

// hover the moons (and the other bodies) for what they are
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tip = $('tip');
addEventListener('pointermove', e => {
  if (e.target.closest('.panel, .plate, a, button, .gem')) { tip.style.opacity = 0; return; }
  ndc.set(e.clientX / W * 2 - 1, -(e.clientY / H) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(tips.map(x => x.mesh), false)[0], info = hit && tips.find(x => x.mesh === hit.object);
  document.querySelectorAll('.moon.on').forEach(m => m.classList.remove('on'));
  if (!info) { tip.style.opacity = 0; return; }
  if (info.i != null) document.querySelector(`.moon[data-i="${info.i}"]`)?.classList.add('on');
  tip.innerHTML = `<small>${escHtml(info.sub)}</small>${escHtml(info.title)}`; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.style.opacity = 1;
});

// hooks for profile-fx.js (flair layer): grow a moon from its list row, then say the page is filled in
window.profileHooks = { moonHi: (i, v) => { if (moons[i]) moons[i].hi = v; } };
document.dispatchEvent(new Event('profile:ready'));
</script>
<script src="profile-fx.js"></script>
